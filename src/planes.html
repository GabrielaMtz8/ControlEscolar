<!DOCTYPE html>
<html lang="es">
<head>

  <title>CRUD Planes de Estudio</title>
      <link rel="stylesheet" href="assets/css/estilos.css">

</head>
<body>
  <h2>CRUD Planes de Estudio</h2>

    </thead>
    <tbody id="tablaPlanes"></tbody>

  <script src="assets/js/crudstyle.js"></script>
